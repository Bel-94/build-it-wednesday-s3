<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found, NimbusForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="error-page">
    <main class="error-panel">
      <img src="assets/logo.svg" alt="" width="48" height="48" />
      <p class="brand-mark">NimbusForge</p>
      <h1>404, Object not found</h1>
      <p>
        S3 could not find that object key. Check the URL, or return to the home
        page served as the bucket’s index document.
      </p>
      <a class="btn" href="index.html">Back to home</a>
    </main>
  </body>
</html>
